<!DOCTYPE html>
<html lang="en" class="light-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History | Fantasy Football Isle of Man</title>
    <link rel="icon" href="/static/img/clubs/PremierLeagueIOM.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="/static/css/tokens.css?v=20260805">
    <link rel="stylesheet" href="/static/css/style.css?v=20260805">
    <script>
        (function () {
            var t = localStorage.getItem('theme');
            if (!t || t === 'null') {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark-theme' : 'light-theme';
            }
            document.documentElement.classList.remove('light-theme', 'dark-theme');
            document.documentElement.classList.add(t);
        })();
    </script>
</head>
<body data-page="history">
    <nav class="game-nav">
        <div class="game-nav__inner">
            <a class="game-nav__brand" href="/">
                <img class="game-nav__logo" src="/static/img/clubs/PremierLeagueIOM.png" alt="Fantasy Football Isle of Man">
            </a>
            <button class="nav-toggle" id="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
            <ul class="game-nav__links" id="nav-links">
                <li><a class="game-nav__link" href="/">Home</a></li>
                <li><a class="game-nav__link" href="/my-team">My Team</a></li>
                <li><a class="game-nav__link" href="/transfers">Transfers</a></li>
                <li><a class="game-nav__link" href="/players">Players</a></li>
                <li><a class="game-nav__link" href="/fixtures">Fixtures</a></li>
                <li><a class="game-nav__link" href="/gameweeks">Gameweeks</a></li>
                <li><a class="game-nav__link is-active" href="/history">History</a></li>
                <li><a class="game-nav__link" href="/leaderboard">Leaderboard</a></li>
                <li><a class="game-nav__link" href="/leagues">Leagues</a></li>
                <li><a class="game-nav__link" href="/dream-team">Dream Team</a></li>
                <li><a class="game-nav__link" href="/rankings">Rankings</a></li>
                <li><a class="game-nav__link" href="/help">Help</a></li>
            </ul>
            <div class="game-nav__right">
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
                    <span class="theme-toggle__sun">&#9728;</span><span class="theme-toggle__moon">&#9790;</span>
                </button>
                <div id="nav-auth" style="display:flex;align-items:center;gap:0.8rem"></div>
            </div>
        </div>
    </nav>

    <main>
        <div class="container">
            <div class="page-header">
                <h1>History</h1>
                <p class="lede">Your gameweek-by-gameweek record.</p>
            </div>
            <div id="history-root"><div class="loading">Loading your history&hellip;</div></div>
        </div>
    </main>

    <script src="/static/js/app.js?v=20260805"></script>
    <script src="/static/js/pages.js?v=20260805"></script>
</body>
</html>
